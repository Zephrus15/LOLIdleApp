name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruir tamanhos do ícone do Windows
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon("Assets/lol-idle.ico", 48, 48)
          $source = $icon.ToBitmap()
          $sizes = @(16, 24, 32, 48, 64, 128, 256)
          $frames = @()
          foreach ($size in $sizes) {
            $bitmap = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.Clear([System.Drawing.Color]::Transparent)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
            # Ícones pequenos recebem margem transparente para evitar corte no Explorer.
            # Os tamanhos maiores mantêm a arte em escala integral.
            $artSize = switch ($size) {
              16 { 12 }
              24 { 20 }
              32 { 28 }
              default { $size }
            }
            $offset = [Math]::Floor(($size - $artSize) / 2)
            $graphics.DrawImage($source, [float]$offset, [float]$offset, [float]$artSize, [float]$artSize)
            $stream = New-Object System.IO.MemoryStream
            $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
            $frames += ,@{ Size = $size; Data = $stream.ToArray() }
            $stream.Dispose()
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $output = [System.IO.File]::Create("Assets/lol-idle.ico")
          $writer = New-Object System.IO.BinaryWriter($output)
          $writer.Write([UInt16]0)
          $writer.Write([UInt16]1)
          $writer.Write([UInt16]$frames.Count)
          $offset = 6 + (16 * $frames.Count)
          foreach ($frame in $frames) {
            $dimension = if ($frame.Size -eq 256) { 0 } else { $frame.Size }
            $writer.Write([Byte]$dimension)
            $writer.Write([Byte]$dimension)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]$frame.Data.Length)
            $writer.Write([UInt32]$offset)
            $offset += $frame.Data.Length
          }
          foreach ($frame in $frames) { $writer.Write([Byte[]]$frame.Data) }
          $writer.Dispose()
          $output.Dispose()
          $source.Dispose()
          $icon.Dispose()
          Write-Host "Ícone reconstruído com tamanhos: $($sizes -join ', ')"
          
      - name: Restaurar dependências
        run: dotnet restore LoLIdleDesktop.csproj

      - name: Publicar para Windows 64 bits
        run: dotnet publish LoLIdleDesktop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Criar pacote ZIP
        shell: pwsh
        run: |
          $publish = "bin/Release/net8.0-windows/win-x64/publish"
          if (!(Test-Path "$publish/LoL Idle.exe")) {
            throw "Executável não encontrado em $publish"
          }
          Compress-Archive -Path "$publish/*" -DestinationPath "LoLIdleDesktop-win-x64.zip" -Force

      - name: Anexar ZIP à Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "LoLIdleDesktop-win-x64.zip" --clobber

      - name: Guardar ZIP de teste
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: LoLIdleDesktop-win-x64-test
          path: LoLIdleDesktop-win-x64.zip
          if-no-files-found: error
