name: Build Windows release

on:
  push:
    branches: [main, 'feature/compact-mode-v1.1.0']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruir tamanhos do ícone do Windows
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon("Assets/lol-idle.ico", 48, 48)
          $source = $icon.ToBitmap()
          $sizes = @(16, 24, 32, 48, 64, 128, 256)
          $frames = @()
          foreach ($size in $sizes) {
            $bitmap = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.Clear([System.Drawing.Color]::Transparent)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
            # Ícones pequenos recebem margem transparente para evitar corte no Explorer.
            # Os tamanhos maiores mantêm a arte em escala integral.
            $artSize = switch ($size) {
              16 { 12 }
              24 { 20 }
              32 { 28 }
              default { $size }
            }
            $offset = [Math]::Floor(($size - $artSize) / 2)
            $graphics.DrawImage($source, [float]$offset, [float]$offset, [float]$artSize, [float]$artSize)
            $stream = New-Object System.IO.MemoryStream
            $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
            $frames += ,@{ Size = $size; Data = $stream.ToArray() }
            $stream.Dispose()
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $output = [System.IO.File]::Create("Assets/lol-idle.ico")
          $writer = New-Object System.IO.BinaryWriter($output)
          $writer.Write([UInt16]0)
          $writer.Write([UInt16]1)
          $writer.Write([UInt16]$frames.Count)
          $offset = 6 + (16 * $frames.Count)
          foreach ($frame in $frames) {
            $dimension = if ($frame.Size -eq 256) { 0 } else { $frame.Size }
            $writer.Write([Byte]$dimension)
            $writer.Write([Byte]$dimension)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]$frame.Data.Length)
            $writer.Write([UInt32]$offset)
            $offset += $frame.Data.Length
          }
          foreach ($frame in $frames) { $writer.Write([Byte[]]$frame.Data) }
          $writer.Dispose()
          $output.Dispose()
          $source.Dispose()
          $icon.Dispose()
          Write-Host "Ícone reconstruído com tamanhos: $($sizes -join ', ')"
          
      - name: Restaurar dependências
        run: dotnet restore LoLIdleDesktop.csproj

      - name: Publicar para Windows 64 bits
        run: dotnet publish LoLIdleDesktop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

      - name: Instalar Inno Setup
        if: hashFiles('installer/LoLIdleDesktop.iss') != ''
        run: choco install innosetup --no-progress -y

      - name: Baixar WebView2 Bootstrapper
        if: hashFiles('installer/LoLIdleDesktop.iss') != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/redist | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer/redist/MicrosoftEdgeWebView2Setup.exe"

      - name: Compilar instalador
        if: hashFiles('installer/LoLIdleDesktop.iss') != ''
        shell: pwsh
        run: |
          $version = @(([xml](Get-Content LoLIdleDesktop.csproj)).Project.PropertyGroup.Version) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if (-not $version) { throw "Versão não encontrada no csproj." }
          $version4 = if ($version -match '^\d+\.\d+\.\d+$') { "$version.0" } else { $version }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado." }
          & $iscc "/DMyAppVersion=$version" "/DMyAppVersion4=$version4" "/DSourceDir=$PWD\bin\Release\net8.0-windows\win-x64\publish" "/O$PWD\artifacts\installer" "installer\LoLIdleDesktop.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o instalador." }

      - name: Criar pacote ZIP
        shell: pwsh
        run: |
          $publish = "bin/Release/net8.0-windows/win-x64/publish"
          if (!(Test-Path "$publish/LoL Idle.exe")) {
            throw "Executável não encontrado em $publish"
          }
          # Cria uma pasta raiz dentro do ZIP para que "Extrair aqui" mantenha tudo organizado.
          $packageRoot = "package/LoLIdleDesktop"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path "$publish/*" -Destination $packageRoot -Recurse -Force
          Compress-Archive -Path "package/LoLIdleDesktop" -DestinationPath "LoLIdleDesktop-win-x64.zip" -Force

      - name: Anexar ZIP à Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "LoLIdleDesktop-win-x64.zip" --clobber

      - name: Guardar ZIP de teste
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: LoLIdleDesktop-win-x64-test
          path: LoLIdleDesktop-win-x64.zip
          if-no-files-found: error

      - name: Anexar instalador à Release
        if: github.event_name == 'release' && hashFiles('installer/LoLIdleDesktop.iss') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "artifacts/installer/LoLIdleDesktop-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $setup) { throw "Instalador não encontrado." }
          gh release upload "${{ github.event.release.tag_name }}" $setup.FullName --clobber

      - name: Guardar instalador de teste
        if: github.event_name != 'release' && hashFiles('installer/LoLIdleDesktop.iss') != ''
        uses: actions/upload-artifact@v4
        with:
          name: LoLIdleDesktop-Setup
          path: artifacts/installer/LoLIdleDesktop-Setup-*-x64.exe
          if-no-files-found: error
